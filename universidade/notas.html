<style>
  :root {
    --chalk: #eef0ec;
    --chalk-dim: #c7cbc3;
    --gold: #c9a24a;
    /* Canvas fixo = resolução nativa do fundo. Não mudar. */
    --stage-w: 2930px; /* corrigido: tamanho real da imagem de fundo (era 2528, causava desalinhamento) */
    --stage-h: 1686px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: var(--stage-w); height: var(--stage-h);
    overflow: hidden;
    background: transparent; /* sem imagem de fundo — essa fica na outra layer do OBS */
    font-family: 'Kalam', cursive;
  }
  #stage {
    position: relative;
    width: var(--stage-w);
    height: var(--stage-h);
  }

  /* Área central: pergunta + opções (medido no quadro "Universidade do Rick") */
  #question-zone {
    position: absolute;
    left: 695px; top: 224px;
    width: 1650px; min-height: 605px; /* min-height em vez de height fixo: perguntas de 2 linhas já não sobrepõem as opções */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 90px; /* pergunta desce mais uma linha, mais espaço abaixo do título */
    color: var(--chalk);
    text-shadow: 0 0 8px rgba(255,255,255,0.35), 0 0 2px rgba(255,255,255,0.6);
  }
  #question-text { flex-shrink: 0; }
  #options-list { flex-shrink: 0; }
  #question-text {
    font-size: 46px;
    line-height: 1.3;
    text-align: center;
    max-width: 820px; /* coluna central estreita — cabe no recorte 9:16 dos clips Portrait da Twitch */
    min-height: 1.4em;
  }
  #options-list {
    margin-top: 36px;
    width: 820px; /* mesma coluna estreita da pergunta, centrada */
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
    max-height: 500px;
    transition: opacity 0.4s ease, max-height 0.5s ease, margin-top 0.5s ease;
  }
  .option-line {
    font-size: 34px; /* reduzido: coluna mais estreita quebra mais linhas, isto controla a altura total */
    opacity: 0;
    color: var(--chalk-dim);
    max-width: 100%;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .option-line.done { opacity: 1; }
  #options-list.hide {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    margin-top: 0;
    transition: opacity 0.4s ease, max-height 0.5s ease, margin-top 0.5s ease;
  }
  #correct-answer-big {
    width: 820px;
    text-align: center;
    font-size: 42px;
    color: var(--chalk);
    text-shadow: 0 0 10px rgba(255,255,255,0.4);
    min-height: 1.3em;
    margin-top: 8px;
  }
  #correct-answer-big .check-mark {
    color: #8fd694;
    text-shadow: 0 0 10px rgba(143,214,148,0.7);
    margin-right: 10px;
  }

  #answer-reveal {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px dashed rgba(255,255,255,0.25);
    width: 780px;
    font-size: 28px;
    line-height: 1.35;
    color: #d8cba0;
    text-align: center;
    min-height: 1.4em;
  }
  #answer-reveal .lightbulb { margin-right: 8px; }
  .chalk-cursor {
    display: inline-block;
    width: 10px;
    height: 34px;
    background: rgba(255,255,255,0.85);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.6s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Timer — medido acima do texto "Aqui não se aprende nada" */
  #timer-zone {
    position: absolute;
    left: 2692px; top: 102px;
    width: 100px; height: 205px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #timer-zone.visible { opacity: 1; }
  #timer-ring-wrap { position: relative; width: 96px; height: 96px; }
  #timer-ring-wrap svg { width: 100%; height: 100%; }
  .clock-rim { fill: none; stroke: var(--gold); stroke-width: 5; }
  .clock-rim-inner { fill: none; stroke: rgba(0,0,0,0.35); stroke-width: 1; }
  .clock-face { fill: #e8dfc4; }
  .clock-tick { stroke: #33261a; stroke-width: 1.6; stroke-linecap: round; }
  .clock-tick.major { stroke-width: 2.4; }
  .clock-hand {
    stroke: #7a1f1a; stroke-width: 3; stroke-linecap: round;
    transform-origin: 50px 50px;
    transition: transform 1s linear;
  }
  .clock-pivot { fill: #2a1e12; }
  #timer-number {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    color: var(--chalk);
    text-shadow: 0 0 6px rgba(255,255,255,0.4);
  }

  /* Notas da Turma — 10 linhas fixas, medidas uma a uma na imagem original */
  #leaderboard-zone {
    position: absolute;
    left: 125px; top: 0px;
    width: 420px; height: 1686px;
  }
  .lb-row {
    position: absolute;
    left: 0; width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Kalam', cursive;
    color: var(--gold);
    font-size: 26px;
  }
  .lb-name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-weight: 700; }

  /* Alerta "Pedido de Teste Surpresa" — aparece quando o redeem chega, antes de qualquer pergunta */
  #exam-alert {
    position: absolute;
    left: 446px; top: 380px;
    width: 1650px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    transform: translateY(-16px) scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
  }
  #exam-alert.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  #exam-alert-box {
    background: rgba(20, 14, 8, 0.55);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 22px 46px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 0 24px rgba(0,0,0,0.5);
  }
  #exam-alert-bell {
    font-size: 44px;
    animation: bell-swing 0.6s ease-in-out 3;
  }
  @keyframes bell-swing {

  #exam-alert-text {
    font-family: 'Kalam', cursive;
    font-size: 40px;
    color: var(--chalk);

  #dev-panel.hidden { display: none; }
  #dev-hint {
    position: absolute; bottom: 8px; right: 8px;
    font-family: sans-serif; font-size: 11px; color: rgba(255,255,255,0.4);

</style>

<script>
/* ---------------------------------------------------------
   ANIMAÇÃO "ESCRITA A GIZ"
   writeChalk(elemento, texto, velocidade) -> Promise
--------------------------------------------------------- */
function writeChalk(el, text, speed = 45) {
  return new Promise(resolve => {
    el.innerHTML = '<span class="chalk-cursor"></span>';
    const cursor = el.querySelector('.chalk-cursor');
    let i = 0;
    function step() {
      if (i < text.length) {
        const span = document.createElement('span');
        span.textContent = text[i];
        span.style.opacity = 0;
        span.style.transition = 'opacity 0.12s ease';
        el.insertBefore(span, cursor);
        requestAnimationFrame(() => span.style.opacity = 1);
        i++;
        setTimeout(step, speed + (Math.random() * 25 - 10));
      } else {
        cursor.remove();
        resolve();
      }
    }
    step();
  });
}

/* ---------------------------------------------------------
   FLUXO PRINCIPAL: mostrar pergunta + opções, depois timer
   showQuestion({ pergunta, opcoes: [A,B,C,D], segundos })
--------------------------------------------------------- */
async function showQuestion({ pergunta, opcoes, respostaCorreta, curiosidade, segundos = 30, onFimDoTempo }) {
  const qEl = document.getElementById('question-text');
  const optionEls = [...document.querySelectorAll('.option-line')];
  const timerZone = document.getElementById('timer-zone');

  // reset
  qEl.innerHTML = '';
  optionEls.forEach(o => { o.classList.remove('done'); o.textContent = ''; o.innerHTML=''; });
  document.getElementById('options-list').classList.remove('hide');
  document.getElementById('correct-answer-big').innerHTML = '';
  timerZone.classList.remove('visible');
  document.getElementById('answer-reveal').innerHTML = '';

  await writeChalk(qEl, pergunta, 40);
  await new Promise(r => setTimeout(r, 300));

  for (let idx = 0; idx < optionEls.length; idx++) {
    const letra = optionEls[idx].dataset.letter;
    optionEls[idx].classList.add('done');
    await writeChalk(optionEls[idx], `${letra}) ${opcoes[idx]}`, 30);
    await new Promise(r => setTimeout(r, 150));
  }

  // ao chegar a 0: regista-se o resultado (isso é o backend a dizer o que aconteceu) —
  // aqui só disparamos a revelação da resposta + atualização do top 10 ao mesmo tempo
  startTimer(segundos, async () => {
    await revealAnswer(respostaCorreta, curiosidade);
    if (typeof onFimDoTempo === 'function') onFimDoTempo();
  });
}

/* ---------------------------------------------------------
   RELÓGIO DE PAREDE — gera as 12 marcas e roda o ponteiro
--------------------------------------------------------- */
function buildClockTicks() {
  const g = document.getElementById('clock-ticks');
  g.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const angle = i * 30;
    const major = i % 3 === 0; // marcas maiores no 12, 3, 6, 9
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', '50');
    line.setAttribute('y1', major ? '8' : '10');
    line.setAttribute('x2', '50');
    line.setAttribute('y2', '16');
    line.setAttribute('class', 'clock-tick' + (major ? ' major' : ''));
    line.setAttribute('transform', `rotate(${angle} 50 50)`);
    g.appendChild(line);
  }
}
buildClockTicks();

function startTimer(segundos, onComplete) {
  const zone = document.getElementById('timer-zone');
  const numberEl = document.getElementById('timer-number');
  const hand = document.getElementById('clock-hand');

  zone.classList.add('visible');
  let remaining = segundos;
  numberEl.textContent = remaining;
  hand.style.transform = 'rotate(0deg)';

  const interval = setInterval(() => {
    remaining--;
    numberEl.textContent = remaining > 0 ? remaining : '0';
    const pct = Math.min(1, Math.max(0, 1 - remaining / segundos));
    hand.style.transform = `rotate(${pct * 360}deg)`; // ponteiro dá uma volta completa até acabar o tempo
    if (remaining <= 0) {
      clearInterval(interval);
      if (typeof onComplete === 'function') onComplete();
    }
  }, 1000);
}

/* ---------------------------------------------------------
   LEADERBOARD — "Notas da Turma"
   updateLeaderboard([{ nome, pontos }, ...]) — top 10
--------------------------------------------------------- */
// Posições Y medidas pixel a pixel sobre as 10 linhas já desenhadas no fundo (2528x1686)
// Corrigido: estava a alinhar uma linha inteira abaixo do previsto (~40px)
const LB_ROW_Y = [1208, 1250, 1289, 1329, 1368, 1408, 1448, 1487, 1528, 1568];

function updateLeaderboard(lista) {
  const zone = document.getElementById('leaderboard-zone');
  zone.innerHTML = '';
  LB_ROW_Y.forEach((y, idx) => {
    const item = lista[idx];
    const row = document.createElement('div');
    row.className = 'lb-row';
    row.style.top = y + 'px';
    if (item) {
      row.innerHTML = `<span class="lb-name">${item.nome}</span><span class="lb-score">${item.notas}</span>`;
    }
    zone.appendChild(row);
  });
}

/* ---------------------------------------------------------
   ALERTA "Pedido de Teste Surpresa" — chamado pelo redeem,
   fica visível uns segundos e desaparece sozinho
--------------------------------------------------------- */
let examAlertTimeout = null;
function showExamAlert(username, duracaoMs = 6000) {
  const el = document.getElementById('exam-alert');
  const userEl = el.querySelector('.user');
  userEl.textContent = '@' + username;
  el.classList.add('show');
  if (examAlertTimeout) clearTimeout(examAlertTimeout);
  examAlertTimeout = setTimeout(() => {
    el.classList.remove('show');
  }, duracaoMs);
}

/* ---------------------------------------------------------
   REVELAR RESPOSTA — a pergunta NUNCA desaparece.
   As 4 opções desaparecem, a resposta certa aparece
   centrada por baixo da pergunta, e a curiosidade a seguir.
   revealAnswer('B) Delfim', 'Os delfins também têm sono unihemisférico...')
--------------------------------------------------------- */
async function revealAnswer(textoRespostaCorreta, curiosidade) {
  const optionsList = document.getElementById('options-list');
  const bigEl = document.getElementById('correct-answer-big');
  const revealEl = document.getElementById('answer-reveal');

  optionsList.classList.add('hide');
  bigEl.innerHTML = '';
  revealEl.innerHTML = '';

  await new Promise(r => setTimeout(r, 450)); // espera as opções desaparecerem

  const check = document.createElement('span');
  check.className = 'check-mark';
  check.textContent = '✔ ';
  bigEl.appendChild(check);
  const textSpan = document.createElement('span');
  bigEl.appendChild(textSpan);
  await writeChalk(textSpan, textoRespostaCorreta, 30);

  await new Promise(r => setTimeout(r, 250));

  const bulb = document.createElement('span');
  bulb.className = 'lightbulb';
  bulb.textContent = '💡';
  revealEl.appendChild(bulb);
  const curioSpan = document.createElement('span');
  revealEl.appendChild(curioSpan);
  await writeChalk(curioSpan, curiosidade, 22);
}

function testQuestion() {
  showQuestion({
    pergunta: 'Qual destes animais tem três corações?',
    opcoes: ['Polvo', 'Delfim', 'Morcego', 'Girafa'],
    respostaCorreta: 'A) Polvo',
    curiosidade: 'O polvo tem três corações: dois bombeiam sangue para as brânquias e um para o resto do corpo.',
    segundos: 30,
    onFimDoTempo: testLeaderboard // simula o backend a mandar o top 10 atualizado no mesmo instante
  });
}
function testLongQuestion() {
  showQuestion({
    pergunta: 'Qual destes países foi o primeiro a dar às mulheres o direito de voto em eleições nacionais, no final do século XIX?',
    opcoes: [
      'Nova Zelândia, em 1893, após décadas de campanhas sufragistas',
      'Estados Unidos da América, logo após a Guerra Civil',
      'Reino Unido, ainda durante o reinado da Rainha Vitória',
      'França, na sequência direta da Revolução Francesa'
    ],
    respostaCorreta: 'A) Nova Zelândia, em 1893, após décadas de campanhas sufragistas',
    curiosidade: 'A Nova Zelândia foi o primeiro país autónomo do mundo a dar o direito de voto às mulheres, em 1893.',
    segundos: 30
  });
}
function testTimer() { startTimer(30); }
function testReveal() {
  revealAnswer('A) Polvo', 'O polvo tem três corações: dois bombeiam sangue para as brânquias e um para o resto do corpo.');
}

/* ---------------------------------------------------------
   SIMULAÇÃO DE SESSÃO — 10 perguntas variadas (disciplina,

   Timer encurtado para 8s só nesta simulação, para não
   esperares os 30s reais x10 — o ciclo (giz→timer→revela→
   notas) é exatamente o mesmo do real.
--------------------------------------------------------- */
const SESSAO_SIMULADA = [
  { disciplina: 'GEO', pergunta: 'Qual destes locais portugueses existe mesmo?',

let simulacaoAtiva = false;
async function simularSessao() {
  if (simulacaoAtiva) return; // evita cliques duplicados a correr em paralelo
  simulacaoAtiva = true;
  const btn = document.getElementById('btn-simular');
  btn.disabled = true;
  btn.textContent = '▶ Simulação em curso...';

  for (let i = 0; i < SESSAO_SIMULADA.length; i++) {
    const q = SESSAO_SIMULADA[i];
    btn.textContent = `▶ Pergunta ${i + 1}/${SESSAO_SIMULADA.length} — ${q.disciplina}`;
    await new Promise(resolveShow => {
      showQuestion({
        pergunta: q.pergunta,
        opcoes: q.opcoes,
        respostaCorreta: q.respostaCorreta,
        curiosidade: q.curiosidade,
        segundos: 8, // encurtado só para a simulação correr rápido — mantido como pediste
        onFimDoTempo: () => {
          testLeaderboard();
          resolveShow(); // só dispara depois da revelação (resposta + curiosidade) terminar de escrever
        }
      });
    });
    await new Promise(r => setTimeout(r, 3000)); // 3s depois da curiosidade estar toda escrita, antes da próxima
  }

  btn.textContent = '▶ Simular Sessão (10 perguntas)';
  btn.disabled = false;
  simulacaoAtiva = false;
}

/* ---------------------------------------------------------
   LIGAÇÃO AO STREAMER.BOT — recebe eventos "General.Custom"
   e chama as funções certas do overlay. Não precisas de
   tocar nisto: os nomes dos eventos é que interessam do
   lado do Streamer.bot (ver notas abaixo).
--------------------------------------------------------- */
const sbClient = new StreamerbotClient({
  host: '127.0.0.1',
  port: 8080,
  onConnect: () => console.log('✅ Ligado ao Streamer.bot'),
  onDisconnect: () => console.log('⚠️ Desligado do Streamer.bot — a tentar religar...')
});

sbClient.on('General.Custom', (payload) => {
  const d = payload.data;
  console.log('Evento recebido do Streamer.bot:', d.event, d);

  switch (d.event) {

    // Disparado pelo redeem "Prova Escrita"
    case 'exam_alert':
      showExamAlert(d.username || 'utilizador');
      break;

    // Disparado pelo botão manual "Lançar Pergunta" no Streamer.bot
    // Argumentos simples (sem arrays), reconstruídos aqui:
    case 'nova_pergunta':
      showQuestion({
        pergunta: d.pergunta,
        opcoes: [d.opcaoA, d.opcaoB, d.opcaoC, d.opcaoD],
        respostaCorreta: d.respostaCorreta,
        curiosidade: d.curiosidade,
        segundos: parseInt(d.segundos, 10) || 30
      });
      break;

    // Disparado pelo Streamer.bot depois de pedir o resultado real ao backend
    // (fechar_ronda), 30s após o "nova_pergunta" — d.top10 é uma lista
    // [{nome, pontos}, ...] já calculada a partir das respostas do chat
    case 'atualizar_notas':
      if (Array.isArray(d.top10)) {
        updateLeaderboard(d.top10);
      }
      break;

  }
});
</script>
